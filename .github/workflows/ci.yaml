# The PR gate and the release, in one workflow. Four jobs:
#   workflows — actionlint and zizmor on this repository's workflows.
#   validate  — the marketplace, the plugin and its skills, via scripts/validate.sh.
#   release   — releases v<version> from plugin.json with its CHANGELOG.md section as the notes,
#               when it has no release yet; main only.
#   ci-pass   — the single required status; a cancel reports nothing.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint shellcheck zizmor
      - run: actionlint
      - run: zizmor --no-online-audits .

  validate:
    name: Validate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: aqua:anthropics/claude-code
      - run: scripts/validate.sh

  release:
    name: Release
    needs:
      - workflows
      - validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -er .version .claude-plugin/plugin.json)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          # An assignment, so a failing script stops the job instead of releasing empty notes.
          notes="$(scripts/release-notes.sh "$version")"
          gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" --notes "$notes"

  ci-pass:
    name: CI pass
    needs:
      - workflows
      - validate
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")'
